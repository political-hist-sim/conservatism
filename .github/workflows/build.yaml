# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install
        run: npm install
      - name: Build game
        run: npm run build
      - name: Package for offline play
        run: bash tools/make_offline.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out/html'
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub can take a few seconds to list a fresh artifact, and
          # deploy-pages fails at once if it asks too soon
          sleep 10
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$n" -ge 1 ]; then
              echo "artifact listed"
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "artifact still not listed; trying the deploy anyway"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
